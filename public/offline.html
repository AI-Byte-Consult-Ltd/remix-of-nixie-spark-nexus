<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>No connection</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #ffffff; color: #0f172a; font-family: system-ui, sans-serif; text-align: center; padding: 0 16px; }
      main { max-width: 360px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #475569; margin: 0 0 20px; }
      button { font: inherit; padding: 10px 20px; border: 0; border-radius: 8px; background: #0f172a; color: #ffffff; }
    </style>
  </head>
  <body>
    <main>
      <h1>No internet connection</h1>
      <p>Нет подключения к интернету. Проверьте сеть и попробуйте снова.</p>
      <button type="button" onclick="location.reload()">Retry · Повторить</button>
    </main>
  </body>
</html>
